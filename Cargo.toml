[package]
name = "qrimg"
version = "0.1.0"
edition = "2024"
description = "Generate QR code images (.webp, .svg, .avif) from text on the command line"
license = "CC0-1.0"
repository = "https://github.com/nakatam1337/qrimg"

[dependencies]
clap = { version = "4", features = ["derive"] }
image-webp = "0.2.4"
qrcode = { version = "0.14", features = ["svg"] }
ravif = "0.13.0"
